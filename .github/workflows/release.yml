name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify release tag
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`)
              throw new Error("Release tag must match package.json version");
          '

      - run: pnpm install --frozen-lockfile
      - run: pnpm dev:prepare
      - run: pnpm typecheck
      - run: pnpm build
      - name: Check whether this version is already published
        id: npm
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`);
          if (!response.ok && response.status !== 404)
            throw new Error(`npm registry returned ${response.status}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `published=${response.ok}\n`);
          JS

      # npm >=11.5.1 supports GitHub Actions trusted publishing (OIDC).
      # Skip prepack here: the package was already built above.
      - if: steps.npm.outputs.published != 'true'
        run: npm publish --access public --provenance --ignore-scripts
      - run: pnpm exec changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
